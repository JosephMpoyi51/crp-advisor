<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRP Advisor</title><style>:root{--bg:#070816;--p:#10152b;--l:rgba(255,255,255,.1);--t:#f8fafc;--m:#aab3c7;--a:#8b5cf6;--c:#22d3ee;--g:#34d399}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(34,211,238,.18),transparent 30%),radial-gradient(circle at 8% 8%,rgba(139,92,246,.22),transparent 30%),var(--bg);color:var(--t);font-family:Inter,system-ui,Segoe UI,sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:24px;padding:18px 5vw;border-bottom:1px solid var(--l);background:rgba(7,8,22,.82);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand span{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--c))}.nav{display:flex;gap:6px;margin-left:auto}.nav a{padding:10px 12px;color:var(--m);border-radius:8px;font-weight:750}.nav a:hover,.nav a.on{background:rgba(255,255,255,.07);color:var(--t)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:0;border-radius:8px;background:linear-gradient(135deg,var(--a),#5b7cfa);color:white;font-weight:850;cursor:pointer}.btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--l)}main,.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.hero{min-height:640px;display:grid;grid-template-columns:1.1fr .8fr;gap:48px;align-items:center}.ey{display:inline-flex;margin-bottom:12px;padding:7px 10px;border:1px solid rgba(139,92,246,.34);border-radius:999px;background:rgba(139,92,246,.12);color:#cabdff;font-size:12px;font-weight:900;text-transform:uppercase}h1{margin:0;font-size:clamp(42px,7vw,78px);line-height:.95}h2{margin:0 0 14px;font-size:clamp(28px,4vw,44px);line-height:1.08}p{color:var(--m)}.lead{font-size:19px;max-width:680px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.metrics,.grid,.flow{display:grid;gap:16px}.metrics{grid-template-columns:repeat(3,1fr);margin-top:36px}.card,.metric,.panel,.qbtn,.result{border:1px solid var(--l);border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.035))}.metric{padding:18px}.metric strong{display:block;font-size:30px}.panel{padding:22px}.preview{padding:18px;box-shadow:0 30px 90px rgba(0,0,0,.35);animation:float 6s ease-in-out infinite}.score{width:128px;aspect-ratio:1;display:grid;place-items:center;border-radius:999px;background:radial-gradient(circle,var(--p) 0 55%,transparent 56%),conic-gradient(var(--g),var(--a),var(--c))}.score strong{font-size:34px}.section{padding:72px 0}.grid.tools{grid-template-columns:repeat(3,1fr)}.grid.cats{grid-template-columns:repeat(5,1fr)}.tool{display:flex;flex-direction:column;gap:14px;min-height:100%;padding:22px;border:1px solid var(--l);border-radius:8px;background:rgba(255,255,255,.05)}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--c));font-weight:900}.tooltop{display:flex;gap:14px;align-items:center}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.tag{padding:6px 9px;border:1px solid var(--l);border-radius:999px;color:var(--m);font-size:12px}.flow{grid-template-columns:repeat(3,1fr)}.flow article{padding:24px}.page{padding:64px 0}.filters,.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}input,select,textarea{width:100%;min-height:46px;border:1px solid var(--l);border-radius:8px;background:rgba(255,255,255,.07);color:var(--t);padding:10px 12px}select option{color:#111}textarea{min-height:120px}.qwrap{min-height:calc(100vh - 80px);display:grid;grid-template-rows:auto 1fr auto}.qbar,.qnav{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:18px 0}.progress{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--c))}.qstage{display:grid;align-content:center;min-height:520px}.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.qbtn{min-height:120px;padding:18px;text-align:left;color:var(--t);cursor:pointer}.qbtn.on{outline:2px solid var(--a);background:rgba(139,92,246,.18)}.result{display:grid;grid-template-columns:auto 1fr auto auto;gap:18px;align-items:center;padding:20px;margin:14px 0}.rank{width:42px;height:42px;display:grid;place-items:center;border-radius:999px;background:var(--a);font-weight:900}table{width:100%;border-collapse:collapse;background:var(--p)}th,td{padding:14px;border-bottom:1px solid var(--l);text-align:left}.foot{display:grid;grid-template-columns:1fr 380px;gap:24px;padding:42px 5vw;border-top:1px solid var(--l)}@keyframes float{50%{transform:translateY(-10px)}}@media(max-width:900px){.hero,.foot{grid-template-columns:1fr}.grid.tools,.grid.cats,.flow,.filters,.form,.qgrid{grid-template-columns:repeat(2,1fr)}.nav{display:none}}@media(max-width:640px){.grid.tools,.grid.cats,.flow,.filters,.form,.qgrid,.metrics,.result{grid-template-columns:1fr}h1{font-size:40px}}</style></head><body><header class="top"><a class="brand" href="/"><span>CRP</span><b>Advisor</b></a><nav class="nav"><a href="/outils">Outils</a><a href="/questionnaire">Questionnaire</a><a href="/comparer">Comparer</a><a href="/blog">Blog</a><a href="/admin">Admin</a></nav><a class="btn" href="/questionnaire">Trouver un outil</a></header><main id="app"></main><footer class="foot"><div><a class="brand" href="/"><span>CRP</span><b>Advisor</b></a><p>Application Node.js + MySQL pour comparer et recommander des outils IA.</p></div><form id="news" class="form"><input name="email" type="email" placeholder="vous@email.com" required><button class="btn">Newsletter</button></form></footer><script>let tools=[],cats=[],answers={};const $=s=>document.querySelector(s),api=(u,o={})=>fetch(u,{method:o.method||'GET',headers:{'Content-Type':'application/json'},credentials:'include',body:o.body?JSON.stringify(o.body):null}).then(async r=>{if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||'Erreur API');return r.status===204?null:r.json()});async function boot(){[cats,tools]=await Promise.all([api('/api/categories'),api('/api/tools')]);render()}addEventListener('click',e=>{const a=e.target.closest('a');if(a&&a.origin===location.origin){e.preventDefault();history.pushState(0,'',a.pathname);render()}});addEventListener('popstate',render);function render(){const p=location.pathname;document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.pathname===p));if(p==='/')return home();if(p==='/outils')return outils();if(p.startsWith('/outil/'))return fiche(p.split('/').pop());if(p==='/questionnaire')return quest();if(p==='/resultats')return results();if(p==='/comparer')return compare();if(p==='/admin')return admin();if(p==='/blog')return blog();$('#app').innerHTML='<section class="page"><h1>Page introuvable</h1></section>'}function card(t){return `<a class="tool" href="/outil/${t.slug}"><div class="tooltop"><div class="logo">${t.name[0]}</div><div><span class="tag">${t.category}</span><h3>${t.name}</h3></div></div><p>${t.description}</p><div class="tags"><span class="tag">${t.price_label}</span><span class="tag">${t.editorial_score}/100</span>${t.api_available?'<span class="tag">API</span>':''}${t.french_support?'<span class="tag">Francais</span>':''}</div></a>`}function home(){const f=[...tools].sort((a,b)=>b.editorial_score-a.editorial_score).slice(0,6);$('#app').innerHTML=`<section class="hero"><div><p class="ey">Comparateur IA independant</p><h1>Trouvez l'outil IA adapte a votre besoin</h1><p class="lead">Repondez a 6 questions, comparez les meilleures solutions et gagnez du temps.</p><div class="actions"><a class="btn" href="/questionnaire">Lancer le questionnaire</a><a class="btn ghost" href="/outils">Explorer les outils</a></div><div class="metrics"><div class="metric"><strong>${cats.length}+</strong><span>categories IA</span></div><div class="metric"><strong>100</strong><span>score maximum</span></div><div class="metric"><strong>6</strong><span>etapes</span></div></div></div><aside class="preview panel"><p class="ey">Recommandation instantanee</p><h2>${f[0]?.name||'ChatGPT'}</h2><div class="score"><strong>${f[0]?.editorial_score||92}</strong></div><p>Besoin, budget, niveau, priorite, API et francais sont pris en compte.</p></aside></section><section class="section"><h2>Outils recommandes</h2><div class="grid tools">${f.map(card).join('')}</div></section><section class="section"><h2>Explorez par categorie</h2><div class="grid cats">${cats.map(c=>`<a class="panel" href="/outils"><h3>${c.name}</h3><p>${c.description}</p></a>`).join('')}</div></section><section class="section"><div class="flow"><article><b>1</b><h3>Besoin</h3></article><article><b>2</b><h3>Budget et priorite</h3></article><article><b>3</b><h3>Top 3 personnalise</h3></article></div></section>`}function outils(){drawTools(tools);setTimeout(()=>{$('#search').oninput=filter;$('#cat').onchange=filter;$('#budget').onchange=filter},0)}function drawTools(list){$('#app').innerHTML=`<section class="page"><p class="ey">Annuaire IA</p><h1>Tous les outils IA</h1><div class="filters"><input id="search" placeholder="Rechercher"><select id="cat"><option value="">Toutes les categories</option>${cats.map(c=>`<option value="${c.slug}">${c.name}</option>`)}</select><select id="budget"><option value="">Tous les budgets</option><option value="free">Gratuit</option><option value="paid">Payant</option></select></div><div id="list" class="grid tools">${list.map(card).join('')}</div></section>`}function filter(){let q=$('#search').value.toLowerCase(),c=$('#cat').value,b=$('#budget').value;let l=tools.filter(t=>(!q||(t.name+' '+t.description).toLowerCase().includes(q))&&(!c||t.category===c)&&(!b||(b==='free'?t.monthly_price<=0:t.monthly_price>0)));$('#list').innerHTML=l.map(card).join('')}function fiche(slug){let t=tools.find(x=>x.slug===slug);if(!t)return;$('#app').innerHTML=`<section class="page"><p class="ey">${t.category}</p><h1>${t.name}</h1><p class="lead">${t.description}</p><div class="actions"><a class="btn" href="${t.affiliate_url||'#'}" target="_blank">Visiter</a><a class="btn ghost" href="/questionnaire">Comparer</a></div><section class="section grid tools"><article class="panel"><h2>Avantages</h2><ul>${t.advantages.map(x=>`<li>${x}</li>`).join('')}</ul></article><article class="panel"><h2>Limites</h2><ul>${t.limits.map(x=>`<li>${x}</li>`).join('')}</ul></article><article class="panel"><h2>Score</h2><div class="score"><strong>${t.editorial_score}</strong></div></article></section></section>`}function quest(){let qs=[['besoin','Quel est votre besoin principal ?',cats.map(c=>[c.slug,c.name,c.description])],['budget','Quel est votre budget mensuel ?',[['gratuit','Gratuit','0 euro'],['petit','Petit budget','< 15 euros/mois'],['moyen','Budget moyen','< 40 euros/mois'],['eleve','Budget eleve','Priorite valeur']]],['niveau','Quel est votre niveau ?',[['debutant','Debutant','Simple'],['intermediaire','Intermediaire','Deja habitue'],['avance','Avance','API et workflows']]],['priorite','Votre priorite ?',[['simplicite','Simplicite','Clair'],['qualite','Qualite','Meilleur rendu'],['integration','Integrations','Workflow'],['confidentialite','Confidentialite','Donnees']]],['apiRequise','Besoin d une API ?',[['true','Oui','Indispensable'],['false','Non','Pas necessaire']]],['francaisRequis','Francais necessaire ?',[['true','Oui','Essentiel'],['false','Non','Anglais ok']]]];let i=0;$('#app').innerHTML='<section class="qwrap"><div class="wrap qbar"><b id="step"></b><div class="progress"><span id="prog"></span></div></div><div class="wrap qstage" id="stage"></div><div class="wrap qnav"><button class="btn ghost" id="prev">Retour</button><button class="btn" id="next">Suivant</button></div></section>';function draw(){let q=qs[i];$('#step').textContent=`Etape ${i+1} sur ${qs.length}`;$('#prog').style.width=((i+1)/qs.length*100)+'%';$('#stage').innerHTML=`<h1>${q[1]}</h1><div class="qgrid">${q[2].map(o=>`<button class="qbtn ${String(answers[q[0]])===String(o[0])?'on':''}" data-v="${o[0]}"><h3>${o[1]}</h3><p>${o[2]}</p></button>`).join('')}</div>`;document.querySelectorAll('.qbtn').forEach(b=>b.onclick=()=>{let v=b.dataset.v;answers[q[0]]=v==='true'?true:v==='false'?false:v;draw()});$('#prev').disabled=i===0;$('#next').disabled=answers[q[0]]===undefined;$('#next').textContent=i===qs.length-1?'Voir mes resultats':'Suivant'}$('#prev').onclick=()=>{if(i>0){i--;draw()}};$('#next').onclick=()=>{if(i<qs.length-1){i++;draw()}else{localStorage.setItem('crp_answers',JSON.stringify(answers));history.pushState(0,'','/resultats');render()}};draw()}function score(ans){return tools.map(t=>{let s=(ans.besoin&&t.category===ans.besoin?34:4)+(t.monthly_price<=0?20:10)+(ans.niveau&&t.levels.includes(ans.niveau)?14:4)+(ans.apiRequise?t.api_available?10:0:10)+(ans.francaisRequis?t.french_support?10:0:10)+Math.round(12*Math.min(t.editorial_score/92,1));return{...t,score_total:s}}).sort((a,b)=>b.score_total-a.score_total)}function results(){let ans=JSON.parse(localStorage.getItem('crp_answers')||'{}'),r=score(ans).slice(0,3);$('#app').innerHTML=`<section class="page"><p class="ey">Resultats</p><h1>Votre top 3 outils IA</h1>${r.map((t,i)=>`<article class="result"><div class="rank">${i+1}</div><div><h2>${t.name}</h2><p>${t.description}</p></div><div class="score"><strong>${Math.round(t.score_total)}</strong></div><a class="btn ghost" href="/outil/${t.slug}">Voir</a></article>`).join('')}<button class="btn" id="lead">Recevoir par email</button></section>`;$('#lead').onclick=async()=>{let email=prompt('Votre email ?');if(email)await api('/api/leads',{method:'POST',body:{email,answers:ans}})}}function compare(){$('#app').innerHTML=`<section class="page"><h1>Comparer</h1><table><tr><th>Outil</th><th>Categorie</th><th>Prix</th><th>API</th><th>Francais</th><th>Score</th></tr>${tools.map(t=>`<tr><td>${t.name}</td><td>${t.category}</td><td>${t.price_label}</td><td>${t.api_available?'Oui':'Non'}</td><td>${t.french_support?'Oui':'Non'}</td><td>${t.editorial_score}</td></tr>`).join('')}</table></section>`}function blog(){$('#app').innerHTML='<section class="page"><p class="ey">Blog</p><h1>Guides IA</h1><article class="panel"><h2>Comment choisir un outil IA</h2><p>Commencez par votre besoin, puis budget, niveau, integrations et confidentialite.</p></article></section>'}function admin(){$('#app').innerHTML='<section class="page"><h1>Admin</h1><form class="form" id="login"><input name="email" placeholder="Email"><input name="password" type="password" placeholder="Mot de passe"><button class="btn">Connexion</button></form><div id="adminbox"></div></section>';$('#login').onsubmit=async e=>{e.preventDefault();await api('/api/admin/login',{method:'POST',body:Object.fromEntries(new FormData(e.target))});let s=await api('/api/admin/stats');$('#adminbox').innerHTML='<div class="grid tools">'+Object.entries(s).map(([k,v])=>`<div class="metric"><span>${k}</span><strong>${v}</strong></div>`).join('')+'</div>'}}$('#news').onsubmit=async e=>{e.preventDefault();await api('/api/newsletter',{method:'POST',body:Object.fromEntries(new FormData(e.target))});e.target.reset()};boot();</script></body></html>
